<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Dealer — Widget Preview</title>
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="stylesheet" href="/blocks/find-dealer/find-dealer.css">
  <style>
    body { margin: 0; padding: 24px; background: #f5f5f5; }
    .section { max-width: 800px; margin: 0 auto; }
  </style>
</head>
<body>
  <main>
    <div class="section" data-section-status="loaded">
      <div class="find-dealer block" data-block-name="find-dealer" data-block-status="loading">
        <div><div>placeholder</div></div>
      </div>
    </div>
  </main>
  <script type="module">
    const block = document.querySelector('.find-dealer');
    const { default: decorate } = await import('/blocks/find-dealer/find-dealer.js');
    if (decorate) await decorate(block, null);
    block.dataset.blockStatus = 'loaded';
  </script>
</body>
</html>
